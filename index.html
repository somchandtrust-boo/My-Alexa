<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CBRND Alexa</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top,#172d52 0%,#07111f 45%,#02050a 100%);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
}

.app{
    width:100%;
    max-width:900px;
    min-height:720px;
    background:rgba(5,13,27,.94);
    border:1px solid rgba(50,200,255,.2);
    border-radius:28px;
    overflow:hidden;
    box-shadow:
        0 25px 100px rgba(0,0,0,.65),
        inset 0 0 70px rgba(0,190,255,.04);
    display:flex;
    flex-direction:column;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    padding:20px 23px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.brand{
    display:flex;
    align-items:center;
    gap:13px;
}

.logo{
    width:52px;
    height:52px;
    flex-shrink:0;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:25px;
    background:linear-gradient(135deg,#00d9ff,#275cff);
    box-shadow:0 0 30px rgba(0,210,255,.4);
}

.brand h1{
    font-size:22px;
}

.brand p{
    color:#8fa6c3;
    font-size:12px;
    margin-top:4px;
}

.top-right{
    display:flex;
    align-items:center;
    gap:10px;
}

select{
    background:#0b1930;
    color:white;
    border:1px solid rgba(255,255,255,.12);
    border-radius:10px;
    padding:9px 11px;
    outline:none;
    cursor:pointer;
}

select option{
    background:#0b1930;
    color:white;
}

.status{
    display:flex;
    align-items:center;
    gap:6px;
    color:#77ffad;
    font-size:12px;
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#39ff88;
    box-shadow:0 0 12px #39ff88;
}

.hero{
    text-align:center;
    padding:35px 20px 20px;
}

.orb{
    width:145px;
    height:145px;
    margin:auto;
    border-radius:50%;
    background:
        radial-gradient(circle at 35% 30%,
        white 0%,
        #9af5ff 8%,
        #21d0ff 23%,
        #185eff 50%,
        #091941 76%,
        #020711 100%);
    box-shadow:
        0 0 35px rgba(0,215,255,.5),
        0 0 100px rgba(40,90,255,.2);
    transition:.3s;
}

.orb.active{
    animation:pulse 1s infinite;
}

@keyframes pulse{
    50%{
        transform:scale(1.06);
        box-shadow:
            0 0 60px rgba(0,240,255,.8),
            0 0 120px rgba(30,90,255,.4);
    }
}

.hero h2{
    margin-top:25px;
    font-size:27px;
}

.hero p{
    color:#879bb7;
    margin-top:8px;
}

.chat{
    flex:1;
    max-height:380px;
    overflow-y:auto;
    padding:10px 24px 20px;
    scroll-behavior:smooth;
}

.message{
    display:flex;
    margin:12px 0;
}

.message.user{
    justify-content:flex-end;
}

.bubble{
    max-width:80%;
    padding:13px 16px;
    border-radius:17px;
    line-height:1.55;
    white-space:pre-wrap;
    word-wrap:break-word;
}

.assistant .bubble{
    background:#0c1b32;
    border:1px solid rgba(100,190,255,.12);
}

.user .bubble{
    background:linear-gradient(135deg,#1257d9,#197bd0);
}

.meta{
    font-size:10px;
    opacity:.55;
    margin-bottom:4px;
}

.quick{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:8px 20px 15px;
    scrollbar-width:none;
}

.quick::-webkit-scrollbar{
    display:none;
}

.quick button{
    white-space:nowrap;
    color:#dcecff;
    background:#0b1930;
    border:1px solid rgba(255,255,255,.1);
    border-radius:20px;
    padding:9px 13px;
    cursor:pointer;
    transition:.2s;
}

.quick button:hover{
    background:#14335c;
    transform:translateY(-1px);
}

.input-area{
    border-top:1px solid rgba(255,255,255,.08);
    padding:15px 20px 20px;
}

.input-row{
    display:flex;
    gap:9px;
}

#input{
    flex:1;
    min-width:0;
    color:white;
    background:#071426;
    border:1px solid rgba(255,255,255,.13);
    border-radius:15px;
    padding:15px;
    outline:none;
    font-size:15px;
}

#input::placeholder{
    color:#6e839e;
}

#input:focus{
    border-color:#20cfff;
    box-shadow:0 0 15px rgba(32,207,255,.08);
}

button.action{
    width:52px;
    height:52px;
    flex-shrink:0;
    border-radius:15px;
    border:1px solid rgba(255,255,255,.12);
    color:white;
    background:#10213a;
    cursor:pointer;
    font-size:20px;
    transition:.2s;
}

button.action:hover{
    background:#193a63;
    transform:translateY(-1px);
}

button.action:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.mic{
    background:linear-gradient(135deg,#00aaff,#285cff)!important;
}

.mic.active{
    background:linear-gradient(135deg,#ff315c,#ff7200)!important;
    animation:micpulse 1s infinite;
}

@keyframes micpulse{
    50%{
        transform:scale(1.06);
    }
}

.footer{
    text-align:center;
    color:#607590;
    font-size:10px;
    padding:9px;
}

@media(max-width:600px){

    body{
        padding:0;
        align-items:stretch;
    }

    .app{
        min-height:100vh;
        border-radius:0;
        border-left:0;
        border-right:0;
    }

    header{
        padding:15px;
    }

    .logo{
        width:45px;
        height:45px;
        font-size:21px;
    }

    .brand h1{
        font-size:18px;
    }

    .brand p{
        display:none;
    }

    .top-right{
        gap:6px;
    }

    select{
        padding:8px 7px;
        font-size:12px;
    }

    .status{
        display:none;
    }

    .hero{
        padding-top:28px;
    }

    .orb{
        width:125px;
        height:125px;
    }

    .hero h2{
        font-size:23px;
    }

    .chat{
        padding-left:14px;
        padding-right:14px;
        max-height:none;
    }

    .bubble{
        max-width:88%;
    }

    .quick{
        padding-left:14px;
        padding-right:14px;
    }

    .input-area{
        padding:12px;
    }

    #input{
        padding:13px;
        font-size:14px;
    }

    button.action{
        width:48px;
        height:48px;
    }
}
</style>
</head>

<body>

<div class="app">

<header>

<div class="brand">

<div class="logo">🤖</div>

<div>
<h1>CBRND Alexa</h1>
<p>Smart Multilingual AI Voice Assistant</p>
</div>

</div>

<div class="top-right">

<select id="language" aria-label="Language">
<option value="auto">Auto</option>
<option value="hi">हिन्दी</option>
<option value="en">English</option>
<option value="gu">ગુજરાતી</option>
</select>

<div class="status">
<span class="dot"></span>
<span id="status">Online</span>
</div>

</div>

</header>


<section class="hero">

<div class="orb" id="orb"></div>

<h2>How can I help you?</h2>

<p>Speak or type your question</p>

</section>


<div class="chat" id="chat"></div>


<div class="quick">

<button onclick="ask('What is your name?')">
👤 Your Name
</button>

<button onclick="ask('What time is it?')">
🕐 Time
</button>

<button onclick="ask('What is today date?')">
📅 Date
</button>

<button onclick="ask('Tell me about history')">
📖 History
</button>

<button onclick="ask('Tell me an original shayari')">
✨ Shayari
</button>

</div>


<div class="input-area">

<div class="input-row">

<input
id="input"
placeholder="Ask CBRND Alexa..."
autocomplete="off"
>

<button
class="action"
id="sendButton"
onclick="send()">
➤
</button>

<button
class="action mic"
id="mic"
onclick="voice()">
🎤
</button>

</div>

</div>


<div class="footer">
CBRND Alexa • Created by Mr. Raaj
</div>

</div>


<script>

/* =========================================================
   CBRND ALEXA
   GITHUB PAGES → RENDER → GEMINI
========================================================= */


/* =========================================================
   IMPORTANT:
   आपका current Render backend URL
========================================================= */

const API_URL =
"https://my-alexa-dzjs.onrender.com";


/* =========================================================
   ELEMENTS
========================================================= */

const input =
document.getElementById("input");

const chat =
document.getElementById("chat");

const language =
document.getElementById("language");

const mic =
document.getElementById("mic");

const orb =
document.getElementById("orb");

const status =
document.getElementById("status");

const sendButton =
document.getElementById("sendButton");


/* =========================================================
   VARIABLES
========================================================= */

let currentLanguage = "auto";

let recognition = null;

let listening = false;

let speaking = false;


/* =========================================================
   LANGUAGE CHANGE
========================================================= */

language.addEventListener(
"change",
function(){

currentLanguage =
this.value;

}
);


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
text,
type="assistant"
){

const message =
document.createElement("div");

message.className =
"message " + type;

const bubble =
document.createElement("div");

bubble.className =
"bubble";

const meta =
document.createElement("div");

meta.className =
"meta";

meta.textContent =
type === "user"
? "You"
: "CBRND Alexa";

bubble.appendChild(meta);

bubble.appendChild(
document.createTextNode(text)
);

message.appendChild(bubble);

chat.appendChild(message);

chat.scrollTop =
chat.scrollHeight;

}


/* =========================================================
   LANGUAGE DETECTION
========================================================= */

function detectLanguage(text){

text =
String(text || "");

if(
/[\u0A80-\u0AFF]/.test(text)
){
return "gu";
}

if(
/[\u0900-\u097F]/.test(text)
){
return "hi";
}

return "en";

}


/* =========================================================
   GET QUESTION LANGUAGE
========================================================= */

function getQuestionLanguage(text){

if(currentLanguage !== "auto"){
return currentLanguage;
}

return detectLanguage(text);

}


/* =========================================================
   SPEAK
========================================================= */

function speak(text){

if(
!("speechSynthesis" in window)
){
return;
}

if(!text){
return;
}

speechSynthesis.cancel();

let lang =
getQuestionLanguage(text);

const utterance =
new SpeechSynthesisUtterance(text);


/*
   Voice language
*/

if(lang === "hi"){
utterance.lang = "hi-IN";
}
else if(lang === "gu"){
utterance.lang = "gu-IN";
}
else{
utterance.lang = "en-IN";
}


/*
   Clear natural voice settings
*/

utterance.rate = 0.88;

utterance.pitch = 1;

utterance.volume = 1;


/*
   Try to select a suitable voice
*/

const voices =
speechSynthesis.getVoices();

let selectedVoice = null;

if(lang === "hi"){

selectedVoice =
voices.find(v =>
v.lang &&
v.lang.toLowerCase()
.startsWith("hi")
);

}

else if(lang === "gu"){

selectedVoice =
voices.find(v =>
v.lang &&
v.lang.toLowerCase()
.startsWith("gu")
);

}

else{

selectedVoice =
voices.find(v =>
v.lang &&
(
v.lang.toLowerCase()
.startsWith("en-in")
||
v.lang.toLowerCase()
.startsWith("en-gb")
||
v.lang.toLowerCase()
.startsWith("en-us")
)
);

}

if(selectedVoice){

utterance.voice =
selectedVoice;

}


utterance.onstart = () => {

speaking = true;

orb.classList.add("active");

};


utterance.onend = () => {

speaking = false;

orb.classList.remove("active");

};


utterance.onerror = () => {

speaking = false;

orb.classList.remove("active");

};


speechSynthesis.speak(
utterance
);

}


/* =========================================================
   TIME
========================================================= */

function getTime(){

return new Intl.DateTimeFormat(
"en-IN",
{
timeZone:"Asia/Kolkata",
hour:"numeric",
minute:"2-digit",
second:"2-digit",
hour12:true
}
).format(new Date());

}


function timeAnswer(lang){

const time =
getTime();

if(lang === "hi"){

return `
अभी भारतीय समय के अनुसार ${time} बजे हैं।
`;

}

if(lang === "gu"){

return `
હાલ ભારતીય સમય અનુસાર ${time} વાગ્યા છે.
`;

}

return `
The current Indian time is ${time}.
`;

}


/* =========================================================
   DATE
========================================================= */

function dateAnswer(lang){

if(lang === "hi"){

const d =
new Intl.DateTimeFormat(
"hi-IN",
{
timeZone:"Asia/Kolkata",
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
}
).format(new Date());

return `आज ${d} है।`;

}


if(lang === "gu"){

const d =
new Intl.DateTimeFormat(
"gu-IN",
{
timeZone:"Asia/Kolkata",
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
}
).format(new Date());

return `આજે ${d} છે.`;

}


const d =
new Intl.DateTimeFormat(
"en-IN",
{
timeZone:"Asia/Kolkata",
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
}
).format(new Date());

return `Today is ${d}.`;

}


/* =========================================================
   IDENTITY
========================================================= */

function identityAnswer(lang){

if(lang === "hi"){

return `
मैं CBRND Alexa हूँ।
आप मुझसे कोई भी सवाल पूछ सकते हैं।
मुझे Mr. Raaj ने बनाया है।
मुझे बनाने के लिए धन्यवाद, Mr. Raaj।
`.trim();

}


if(lang === "gu"){

return `
હું CBRND Alexa છું.
તમે મને કોઈપણ પ્રશ્ન પૂછી શકો છો.
મને Mr. Raaj એ બનાવ્યો છે.
મને બનાવવા માટે આભાર, Mr. Raaj.
`.trim();

}


return `
I am CBRND Alexa.
You can ask me any question.
I was created by Mr. Raaj.
Thank you, Mr. Raaj, for creating me.
`.trim();

}


/* =========================================================
   TIME QUESTION DETECTION
========================================================= */

function isTime(text){

const t =
String(text || "")
.toLowerCase()
.trim();

return [

"what time",
"current time",
"time now",
"tell me the time",
"tell time",
"what's the time",
"whats the time",
"time please",

"अभी कितने बजे",
"कितने बजे",
"समय क्या है",
"अभी समय",
"समय बताओ",
"टाइम क्या है",
"टाइम बताओ",
"अभी का समय",

"હમણાં કેટલા વાગ્યા",
"કેટલા વાગ્યા",
"સમય કેટલો",
"હાલ કેટલા વાગ્યા",
"સમય જણાવો",
"ટાઈમ કેટલો",
"ટાઇમ કેટલો"

]
.some(x =>
t.includes(x)
);

}


/* =========================================================
   DATE QUESTION DETECTION
========================================================= */

function isDate(text){

const t =
String(text || "")
.toLowerCase()
.trim();

return [

"today date",
"what is the date",
"today's date",
"date today",
"what date is today",
"tell me today's date",
"tell me the date",

"आज की तारीख",
"आज तारीख",
"आज कौन सी तारीख",
"आज की डेट",
"आज डेट क्या है",
"आज की डेट बताओ",
"तारीख क्या है",

"આજની તારીખ",
"આજે તારીખ",
"આજ કઈ તારીખ",
"આજની ડેટ",
"તારીખ શું છે",
"આજની તારીખ જણાવો"

]
.some(x =>
t.includes(x)
);

}


/* =========================================================
   IDENTITY QUESTION DETECTION
========================================================= */

function isIdentity(text){

const t =
String(text || "")
.toLowerCase()
.trim();

return [

"what is your name",
"your name",
"who are you",
"who created you",
"who made you",
"who is your creator",
"what's your name",
"whats your name",
"tell me your name",

"आपका नाम क्या है",
"तुम्हारा नाम क्या है",
"आप कौन हो",
"तुम कौन हो",
"तुम्हें किसने बनाया",
"आपको किसने बनाया",
"आपको किसने बनाया है",
"तुम्हारा creator कौन है",

"તમારું નામ શું છે",
"તમે કોણ છો",
"તમને કોણે બનાવ્યા",
"તમને કોણે બનાવ્યું",
"તમને કોણે બનાવ્યા છે",
"તમારા creator કોણ છે"

]
.some(x =>
t.includes(x)
);

}


/* =========================================================
   SHAYARI DETECTION
========================================================= */

function isShayari(text){

const t =
String(text || "")
.toLowerCase();

return [

"shayari",
"शायरी",
"શાયરી",
"poetry",
"poem",
"कविता",
"કવિતા"

]
.some(x =>
t.includes(x)
);

}


/* =========================================================
   ORIGINAL SHAYARI
========================================================= */

function shayariAnswer(lang){

if(lang === "hi"){

return `
चाँद से रोशनी ली, सितारों से चमक ली,
तेरी मुस्कान से हमने थोड़ी खुशी ली।
रास्ते चाहे कितने भी मुश्किल क्यों न हों,
उम्मीद ने हर बार नई राह दिखा दी।
`.trim();

}


if(lang === "gu"){

return `
ચાંદ પાસેથી પ્રકાશ લીધો, તારાઓ પાસેથી ચમક લીધી,
તારી સ્મિતમાંથી થોડી ખુશી લીધી.
રસ્તા ભલે ગમે તેટલા મુશ્કેલ હોય,
આશાએ હંમેશા નવી રાહ બતાવી.
`.trim();

}


return `
I borrowed light from the moon and sparkle from the stars,
and found a little happiness in your smile.
No matter how difficult the road becomes,
hope always shows us a new way.
`.trim();

}


/* =========================================================
   OFFLINE FALLBACK
   Used when Gemini returns 429 / 500 / network error
========================================================= */

function getFallbackAnswer(command, lang){

const text =
String(command || "")
.toLowerCase();


/*
   Time
*/

if(isTime(command)){

return timeAnswer(lang);

}


/*
   Date
*/

if(isDate(command)){

return dateAnswer(lang);

}


/*
   Identity
*/

if(isIdentity(command)){

return identityAnswer(lang);

}


/*
   Shayari
*/

if(isShayari(command)){

return shayariAnswer(lang);

}


/*
   History
*/

if(
text.includes("history") ||
text.includes("इतिहास") ||
text.includes("ઇતિહાસ")
){

if(lang === "hi"){

return `
इतिहास मानव सभ्यता, संस्कृतियों और महत्वपूर्ण घटनाओं का अध्ययन है।
आप किसी विशेष देश, व्यक्ति या ऐतिहासिक घटना का नाम पूछ सकते हैं।
`.trim();

}

if(lang === "gu"){

return `
ઇતિહાસ માનવ સંસ્કૃતિ, સમાજ અને મહત્વપૂર્ણ ઘટનાઓનો અભ્યાસ છે.
તમે કોઈ ચોક્કસ દેશ, વ્યક્તિ અથવા ઐતિહાસિક ઘટના વિશે પૂછી શકો છો.
`.trim();

}

return `
History is the study of human civilization, cultures and important events.
You can ask me about a specific country, person or historical event.
`.trim();

}


/*
   Generic fallback
*/

if(lang === "hi"){

return `
मैं CBRND Alexa हूँ।
अभी मेरी online AI service की usage limit पूरी हो गई है।
आप मुझसे समय, तारीख, मेरा नाम, शायरी और basic questions पूछ सकते हैं।
कृपया थोड़ी देर बाद general AI question फिर से पूछें।
`.trim();

}


if(lang === "gu"){

return `
હું CBRND Alexa છું.
હાલ મારી online AI service ની usage limit પૂર્ણ થઈ ગઈ છે.
તમે મને સમય, તારીખ, મારું નામ, શાયરી અને basic questions પૂછી શકો છો.
થોડી વાર પછી general AI question ફરીથી પૂછો.
`.trim();

}


return `
I am CBRND Alexa.
My online AI service has reached its current usage limit.
You can still ask me for the time, date, my name, shayari and basic questions.
Please try general AI questions again later.
`.trim();

}


/* =========================================================
   MAIN ASK FUNCTION
========================================================= */

async function ask(command){

command =
String(command || "")
.trim();


if(!command){

return;

}


/*
   Show user question
*/

addMessage(
command,
"user"
);


/*
   Clear input
*/

input.value = "";


/*
   Determine language BEFORE clearing input
*/

const lang =
getQuestionLanguage(command);


/* =========================================================
   LOCAL TIME
========================================================= */

if(isTime(command)){

const answer =
timeAnswer(lang);

addMessage(
answer,
"assistant"
);

speak(answer);

return;

}


/* =========================================================
   LOCAL DATE
========================================================= */

if(isDate(command)){

const answer =
dateAnswer(lang);

addMessage(
answer,
"assistant"
);

speak(answer);

return;

}


/* =========================================================
   LOCAL IDENTITY
========================================================= */

if(isIdentity(command)){

const answer =
identityAnswer(lang);

addMessage(
answer,
"assistant"
);

speak(answer);

return;

}


/* =========================================================
   LOCAL SHAYARI
========================================================= */

if(isShayari(command)){

/*
   We can answer original shayari
   without consuming Gemini quota.
*/

const answer =
shayariAnswer(lang);

addMessage(
answer,
"assistant"
);

speak(answer);

return;

}


/* =========================================================
   BACKEND CHECK
========================================================= */

if(!API_URL){

const answer =
lang === "hi"
?
"AI backend अभी connected नहीं है।"
:
lang === "gu"
?
"AI backend હજી connected નથી."
:
"AI backend is not connected yet.";

addMessage(
answer,
"assistant"
);

speak(answer);

return;

}


/* =========================================================
   AI REQUEST
========================================================= */

try{

status.textContent =
"Thinking...";

orb.classList.add(
"active"
);

sendButton.disabled =
true;


/*
   Send request to Render
*/

const response =
await fetch(
API_URL + "/api/ask",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

message:
command,

language:
lang

})

}
);


/*
   Safely read response
*/

let data = null;

try{

data =
await response.json();

}
catch{

data = null;

}


/*
   Successful Gemini response
*/

if(
response.ok &&
data &&
data.success &&
data.answer
){

const answer =
String(data.answer)
.trim();


addMessage(
answer,
"assistant"
);

speak(answer);

return;

}


/*
   Gemini 429
*/

if(
response.status === 429
){

console.warn(
"Gemini quota/rate limit reached."
);

const fallback =
getFallbackAnswer(
command,
lang
);

addMessage(
fallback,
"assistant"
);

speak(fallback);

return;

}


/*
   Other server error
*/

const serverError =
data &&
data.error
?
String(data.error)
:
"AI server error";


console.error(
"AI Server Error:",
serverError
);


/*
   Fallback instead of ugly error
*/

const fallback =
getFallbackAnswer(
command,
lang
);

addMessage(
fallback,
"assistant"
);

speak(fallback);


}
catch(error){

console.error(
"AI connection error:",
error
);


/*
   Internet / Render / Gemini error
   → fallback
*/

const fallback =
getFallbackAnswer(
command,
lang
);

addMessage(
fallback,
"assistant"
);

speak(fallback);


}
finally{

status.textContent =
"Online";

orb.classList.remove(
"active"
);

sendButton.disabled =
false;

}

}


/* =========================================================
   SEND BUTTON
========================================================= */

function send(){

const text =
input.value.trim();

if(!text){

return;

}

ask(text);

}


/* =========================================================
   ENTER KEY
========================================================= */

input.addEventListener(
"keydown",
function(event){

if(event.key === "Enter"){

event.preventDefault();

send();

}

}
);


/* =========================================================
   VOICE SETUP
========================================================= */

function setupVoice(){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if(!SpeechRecognition){

mic.disabled =
true;

mic.title =
"Voice recognition is not supported in this browser.";

return;

}


recognition =
new SpeechRecognition();


recognition.continuous =
false;

recognition.interimResults =
false;

recognition.maxAlternatives =
1;


/*
   Start
*/

recognition.onstart =
function(){

listening =
true;

mic.classList.add(
"active"
);

orb.classList.add(
"active"
);

status.textContent =
"Listening...";

};


/*
   Result
*/

recognition.onresult =
function(event){

const result =
event.results[0];

if(!result){
return;
}

const text =
result[0].transcript;

input.value =
text;

ask(text);

};


/*
   Error
*/

recognition.onerror =
function(event){

console.error(
"Speech recognition error:",
event.error
);

listening =
false;

mic.classList.remove(
"active"
);

orb.classList.remove(
"active"
);

status.textContent =
"Online";


if(
event.error ===
"not-allowed"
){

const lang =
currentLanguage === "auto"
?
"en"
:
currentLanguage;

let message;

if(lang === "hi"){

message =
"Microphone permission allow करें।";

}
else if(lang === "gu"){

message =
"Microphone permission allow કરો.";

}
else{

message =
"Please allow microphone permission.";

}

addMessage(
message,
"assistant"
);

speak(message);

}

};


/*
   End
*/

recognition.onend =
function(){

listening =
false;

mic.classList.remove(
"active"
);

orb.classList.remove(
"active"
);

status.textContent =
"Online";

};

}


/* =========================================================
   VOICE BUTTON
========================================================= */

function voice(){

if(!recognition){

const lang =
currentLanguage === "auto"
?
"en"
:
currentLanguage;

let message;

if(lang === "hi"){

message =
"इस browser में voice recognition supported नहीं है। Chrome browser का उपयोग करें।";

}
else if(lang === "gu"){

message =
"આ browser માં voice recognition supported નથી. Chrome browser નો ઉપયોગ કરો.";

}
else{

message =
"Voice recognition is not supported in this browser. Please use Chrome.";

}

addMessage(
message,
"assistant"
);

speak(message);

return;

}


if(listening){

recognition.stop();

return;

}


/*
   Set recognition language
*/

let lang =
currentLanguage;


/*
   Auto mode:
   Use previous input language if available.
   Otherwise English.
*/

if(lang === "auto"){

const existingText =
input.value.trim();

if(existingText){

lang =
detectLanguage(existingText);

}
else{

lang =
"en";

}

}


if(lang === "hi"){

recognition.lang =
"hi-IN";

}
else if(lang === "gu"){

recognition.lang =
"gu-IN";

}
else{

recognition.lang =
"en-IN";

}


try{

recognition.start();

}
catch(error){

console.warn(
"Recognition start error:",
error
);

}

}


/* =========================================================
   SPEECH SYNTHESIS VOICES LOAD
========================================================= */

if(
"speechSynthesis" in window
){

speechSynthesis.onvoiceschanged =
function(){

speechSynthesis.getVoices();

};

}


/* =========================================================
   START
========================================================= */

setupVoice();


/* =========================================================
   WELCOME MESSAGE
========================================================= */

const welcome =
`
Hello! I am CBRND Alexa.

You can ask me questions in Hindi, English or Gujarati.

You can also ask me the current time, today's date,
history, original shayari and many other questions.

I was created by Mr.Raaj.
`.trim();


addMessage(
welcome,
"assistant"
);

</script>
